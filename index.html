<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>志布志市はいくつ？</title>
    <meta name="google-site-verification" content="yh0j5vaFe_TMofowiBv4DCqyoIbE9I_oUWtGRS7q1Mo" />
    <link rel="icon" type="image/png" href="ファビコン.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <header class="header">
            <div class="header-inner">
                <h1 class="title">志布志市はいくつ？</h1>
                <p class="subtitle">ランダムな文字の中から <span class="target-word">志布志市</span> を全部見つけよう！タイムを競え！</p>
                <div class="rules">
                    <span class="rule-item">8方向（横・縦・斜め）に探索</span>
                    <span class="rule-sep">•</span>
                    <span class="rule-item">志→布→志→市の順に4マスクリック</span>
                    <span class="rule-sep">•</span>
                    <span class="rule-item">全発見で自動クリア！</span>
                </div>
            </div>
        </header>

        <section class="settings-section">
            <div class="settings-inner">
                <div class="size-selector">
                    <label for="boardSize" class="settings-label">盤面サイズ</label>
                    <select id="boardSize" class="select">
                        <option value="4">4×4（初級）</option>
                        <option value="5">5×5（初級）</option>
                        <option value="6">6×6（初級）</option>
                        <option value="7">7×7（中級）</option>
                        <option value="8">8×8（中級）</option>
                        <option value="9">9×9（中級）</option>
                        <option value="10" selected>10×10（中級）</option>
                        <option value="11">11×11（上級）</option>
                        <option value="12">12×12（上級）</option>
                        <option value="13">13×13（上級）</option>
                        <option value="14">14×14（上級）</option>
                        <option value="15">15×15（上級）</option>
                        <option value="16">16×16（超上級）</option>
                        <option value="17">17×17（超上級）</option>
                        <option value="18">18×18（超上級）</option>
                        <option value="19">19×19（超上級）</option>
                        <option value="20">20×20（超上級）</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button id="startBtn" class="btn btn-primary">ゲーム開始</button>
                    <button id="regenBtn" class="btn btn-secondary" disabled>再生成</button>
                    <button id="resetBtn" class="btn btn-ghost" disabled>リセット</button>
                    <button id="rankingBtn" class="btn btn-ghost">ランキング</button>
                </div>
            </div>
        </section>

        <section id="gameSection" class="game-section" hidden>

            <div class="board-outer">
                <div class="board-wrapper" id="boardWrapper">
                    <div id="board" class="board"></div>
                    <svg id="svgOverlay" class="svg-overlay"></svg>
                </div>
            </div>

            <div class="answer-section">
                <p class="answer-prompt">「志布志市」を全部見つけよう！</p>
                <p class="answer-hint">志 → 布 → 志 → 市 の順に4マスをクリック</p>
                <div class="game-hud">
                    <div class="hud-item">
                        <span id="foundCountEl" class="hud-value">0 / 0</span>
                        <span class="hud-label">発見</span>
                    </div>
                    <div class="hud-item">
                        <span id="timerEl" class="hud-value hud-value--timer">0.0</span>
                        <span class="hud-label">秒</span>
                    </div>
                </div>
                <div class="answer-row">
                    <button id="clearBtn"  class="btn btn-ghost"   disabled>選択解除</button>
                    <button id="finishBtn" class="btn btn-primary" disabled>ギブアップ</button>
                </div>
                <p id="errorMsg" class="error-msg" hidden></p>
            </div>

            <div id="resultSection" class="result-section" hidden>
                <div class="result-stats">
                    <div class="stat">
                        <span class="stat-label">発見</span>
                        <span id="foundCountResultEl" class="stat-value"></span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat">
                        <span class="stat-label">正解数</span>
                        <span id="totalCountResultEl" class="stat-value"></span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat">
                        <span class="stat-label">タイム</span>
                        <span id="clearTimeEl" class="stat-value hud-value--timer"></span>
                    </div>
                </div>
                <div id="verdictEl" class="verdict"></div>
                <p id="messageEl" class="result-message"></p>
                <div class="result-actions">
                    <button id="nextBtn" class="btn btn-primary btn-large">次の問題へ</button>
                    <a id="shareBtn" class="btn btn-x" target="_blank" rel="noopener noreferrer" hidden>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                        </svg>
                        Xでシェア
                    </a>
                </div>

                <!-- ランキング登録（クリア時のみ表示） -->
                <div id="rankingRegister" class="ranking-register" hidden>
                    <div class="ranking-register-title">ランキングに登録する</div>
                    <div class="ranking-input-row">
                        <input type="text" id="playerNameInput" class="ranking-name-input"
                               placeholder="お名前（最大10文字）" maxlength="10">
                        <button id="registerBtn" class="btn btn-primary">登録</button>
                    </div>
                    <p id="rankResultEl" class="rank-result" hidden></p>
                </div>
            </div>
        </section>

        <!-- ランキングモーダル -->
        <div id="rankingModal" class="ranking-modal" hidden>
            <div class="ranking-modal-inner">
                <div class="ranking-modal-header">
                    <h2 class="ranking-modal-title">ランキング</h2>
                    <button id="closeRankingBtn" class="ranking-close-btn">×</button>
                </div>
                <div class="ranking-size-row">
                    <label class="settings-label">盤面サイズ</label>
                    <select id="rankingBoardSize" class="select">
                        <option value="4">4×4（初級）</option>
                        <option value="5">5×5（初級）</option>
                        <option value="6">6×6（初級）</option>
                        <option value="7">7×7（中級）</option>
                        <option value="8">8×8（中級）</option>
                        <option value="9">9×9（中級）</option>
                        <option value="10" selected>10×10（中級）</option>
                        <option value="11">11×11（上級）</option>
                        <option value="12">12×12（上級）</option>
                        <option value="13">13×13（上級）</option>
                        <option value="14">14×14（上級）</option>
                        <option value="15">15×15（上級）</option>
                        <option value="16">16×16（超上級）</option>
                        <option value="17">17×17（超上級）</option>
                        <option value="18">18×18（超上級）</option>
                        <option value="19">19×19（超上級）</option>
                        <option value="20">20×20（超上級）</option>
                    </select>
                    <button id="loadRankingBtn" class="btn btn-secondary">表示</button>
                </div>
                <div id="rankingTableArea" class="ranking-table-area">
                    <p class="ranking-loading">読み込み中...</p>
                </div>
            </div>
        </div>

        <footer class="footer">
            <a href="https://www.softex-celware.com/" target="_blank" rel="noopener noreferrer" class="footer-logo-link">
                <img src="softex-celwareロゴ 透過 横長.png" alt="SOFTEX-CELWARE" class="footer-logo">
            </a>
            <p>鹿児島県志布志市 — 志布志市志布志町志布志2丁目1番1号</p>
            <a href="https://www.city.shibushi.lg.jp/" target="_blank" rel="noopener noreferrer" class="footer-city-link">志布志市公式サイト</a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
